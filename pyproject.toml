[project]
name = "eddn-tail"
version = "0.1.0"
description = "A KinesisTail-like TUI for monitoring the EDDN live stream"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "AwaNoodle"}]
keywords = ["eddn", "elite-dangerous", "tui", "zeromq", "zmq", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyzmq>=25.0",
    "textual>=0.40",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/AwaNoodle/eddn-tail"
Repository = "https://github.com/AwaNoodle/eddn-tail"
Issues = "https://github.com/AwaNoodle/eddn-tail/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
eddn-tail = "eddn_tail:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
