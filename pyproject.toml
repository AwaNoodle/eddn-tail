[project]
name = "eddn-tail"
version = "0.3.0"
description = "A KinesisTail-like TUI for monitoring the EDDN live stream"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "AwaNoodle"}]
keywords = ["eddn", "elite-dangerous", "tui", "zeromq", "zmq", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyzmq>=26.1",  # first release with prebuilt wheels for Python 3.13
    "textual>=2.0,<9",  # 2.0 is the verified floor (Input.Blurred etc.); capped below the next major
    "rich>=13.3.3",  # only used for rich.markup.escape (ancient, stable); floor matches textual's own requirement
]

[project.urls]
Homepage = "https://github.com/AwaNoodle/eddn-tail"
Repository = "https://github.com/AwaNoodle/eddn-tail"
Issues = "https://github.com/AwaNoodle/eddn-tail/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.15.12"]

[project.scripts]
eddn-tail = "eddn_tail:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 160

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, C4: comprehensions, UP: pyupgrade
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["eddn_tail"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
