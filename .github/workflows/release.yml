name: Release

on:
  push:
    branches: [main]

# Serialize runs of this workflow so two pushes to main in quick succession
# cannot both decide "tag doesn't exist yet" and race on creating it. A
# queued run re-checks tag existence after the one ahead of it finishes, so
# it correctly falls through to the "already released" path if the first
# run already tagged and published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap, ungated: runs on every push to main. Only decides whether a
  # release is needed; does not touch PyPI or create anything. Kept out of
  # the `release` environment so it never waits on human approval - only an
  # actual publish should do that.
  check:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full tag history to check whether v<version> exists

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whether this push needs a release
        id: check
        run: python3 scripts/check_release_needed.py

  # Gated by the `release` environment (required reviewers, once configured
  # there). Only runs when `check` found an unreleased version bump.
  release:
    needs: check
    if: needs.check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write  # for PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Extract changelog section for this version
        # Runs before the tag is created: a missing/empty changelog section
        # must fail here, before anything irreversible happens.
        run: python3 scripts/extract_changelog.py "${{ needs.check.outputs.version }}" > release_notes.md

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

      - name: Check PyPI publish state before publishing
        run: python3 scripts/check_pypi_publish.py pre "${{ needs.check.outputs.version }}"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          trusted-publishing: true
          skip-existing: true

      - name: Verify PyPI publish outcome
        run: python3 scripts/check_pypi_publish.py post "${{ needs.check.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          # Explicit patterns, not dist/* - `uv build` writes a .gitignore into
          # dist/, which the glob would sweep up and GitHub would attach as
          # "default.gitignore". Attestations are produced by the publish step.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.publish.attestation
          body_path: release_notes.md
