name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:          # no queue today (user-owned repo); ready if this moves to an org

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov=eddn_tail --cov-report=term-missing

  test-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.9"

      - name: Install dependencies at their declared floor
        run: |
          uv sync --extra dev
          uv pip install "textual==2.0" "pyzmq==26.1" "rich==13.3.3"

      - name: Show pinned floor versions
        run: uv pip freeze | grep -E "^(textual|pyzmq|rich)=="

      - name: Run tests against floor versions
        run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .
